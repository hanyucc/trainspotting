name: Deploy project website

on:
  workflow_dispatch:
    inputs:
      website_ref:
        description: Website branch, tag, or commit to publish
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the website
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: hanyucc/trainspotting-website
          ref: ${{ inputs.website_ref }}
          token: ${{ secrets.WEBSITE_READ_TOKEN || github.token }}
          persist-credentials: false
          path: site
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Check site entry points
        run: |
          test -s site/index.html
          test -s site/explorer.html
          test -s site/explorer-config.json
          git -C site rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
